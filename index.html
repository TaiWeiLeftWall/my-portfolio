<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="沉礁摄影作品集 - 杭州自由摄影师，风光、人像、街头、旅行摄影作品">
    <meta property="og:title" content="摄影作品集 | 沉礁">
    <meta property="og:description" content="沉礁摄影作品集 - 杭州自由摄影师，风光、人像、街头、旅行摄影作品">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/icons/LOGO_white.png">
    <link rel="icon" href="images/icons/LOGO_white.png" type="image/png">
    <title>摄影作品集 | 沉礁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar"></nav>

    <!-- 分类筛选 -->
    <section class="categories">
        <div class="container">
            <button class="category-btn active" data-category="landscape">风光</button>
            <button class="category-btn" data-category="portrait">人像</button>
            <button class="category-btn" data-category="street">街头</button>
            <button class="category-btn" data-category="travel">旅行</button>
            <button class="category-btn" data-category="all">全部</button>

            <!-- 显示模式切换 -->
            <div class="display-mode-toggle">
                <button class="mode-btn active" data-mode="stacked">时间线</button>
                <button class="mode-btn" data-mode="random">随机展示</button>
            </div>

            <!-- 年份筛选 -->
            <select id="year-filter" class="date-filter">
                <option value="all">所有年份</option>
            </select>

            <!-- 月份筛选 -->
            <select id="month-filter" class="date-filter">
                <option value="all">所有月份</option>
            </select>
        </div>
    </section>

    <!-- 作品画廊 -->
    <main class="gallery">
        <div class="container">
            <div class="gallery-grid" id="gallery-grid">
                <!-- 照片将通过 JavaScript 动态插入 -->
            </div>
        </div>
    </main>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-img-wrapper">
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
            <img class="watermark-overlay" src="images/icons/LOGO_white.png" alt="watermark">
        </div>
        <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>

    <!-- 页脚 -->
    <footer></footer>

    <script src="common.js"></script>
    <script src="data.js?v=1"></script>
    <script src="script.js?v=1"></script>
</body>
</html>
