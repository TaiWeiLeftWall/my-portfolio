<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影作品集 | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">摄影师名称</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">作品</a></li>
                <li><a href="videos.html">视频</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- 分类筛选 -->
    <section class="categories">
        <div class="container">
            <button class="category-btn active" data-category="all">全部</button>
            <button class="category-btn" data-category="landscape">风光</button>
            <button class="category-btn" data-category="portrait">人像</button>
            <button class="category-btn" data-category="street">街头</button>
            <button class="category-btn" data-category="travel">旅行</button>
        </div>
    </section>

    <!-- 作品画廊 -->
    <main class="gallery">
        <div class="container">
            <div class="gallery-grid" id="gallery-grid">
                <!-- 照片将通过 JavaScript 动态插入 -->
            </div>
        </div>
    </main>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <p>&copy; 2026 摄影师名称. All rights reserved.</p>
            <div class="social-links">
                <a href="#">Instagram</a>
                <a href="#">微博</a>
                <a href="#">小红书</a>
            </div>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
