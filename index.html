<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="沉礁摄影作品集 - 杭州自由摄影师，风光、人像、街头、旅行摄影作品">
    <meta property="og:title" content="摄影作品集 | 沉礁">
    <meta property="og:description" content="沉礁摄影作品集 - 杭州自由摄影师，风光、人像、街头、旅行摄影作品">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://pub-0f1fd51184d04cc28d2ffffbd03a30de.r2.dev/icons/LOGO_white.png">
    <link rel="icon" href="https://pub-0f1fd51184d04cc28d2ffffbd03a30de.r2.dev/icons/LOGO_white.png" type="image/png">
    <title>摄影作品集 | 沉礁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar"></nav>

    <!-- 筛选栏 - 左侧边栏 -->
    <section class="filter-bar">
        <div class="filter-bar-inner">
            <!-- 左侧边栏 -->
            <aside class="filter-sidebar">
                <!-- 显示模式 -->
                <div class="filter-group">
                    <div class="filter-group-title">显示</div>
                    <div class="display-mode-group">
                        <div class="display-mode-toggle">
                            <button class="mode-btn active" data-mode="stacked">时间线</button>
                            <button class="mode-btn" data-mode="random">随机</button>
                        </div>
                    </div>
                </div>

                <div class="filter-divider"></div>

                <!-- 分类筛选 -->
                <div class="filter-group">
                    <div class="filter-group-title">分类</div>
                    <div class="category-list">
                        <button class="category-btn active" data-category="all">全部</button>
                        <button class="category-btn" data-category="landscape">风光</button>
                        <button class="category-btn" data-category="portrait">人像</button>
                        <button class="category-btn" data-category="street">街头</button>
                        <button class="category-btn" data-category="performance">演出</button>
                    </div>
                </div>

                <div class="filter-divider"></div>

                <!-- 时间筛选 -->
                <div class="filter-group">
                    <div class="filter-group-title">时间</div>
                    <div class="date-filter-group">
                        <select id="year-filter" class="date-filter">
                            <option value="all">全部年份</option>
                        </select>
                        <select id="month-filter" class="date-filter">
                            <option value="all">全部月份</option>
                        </select>
                    </div>
                </div>
            </aside>

            <!-- 右侧主内容 -->
            <div class="filter-main">
                <!-- 作品画廊 -->
                <main class="gallery">
                    <div class="gallery-grid" id="gallery-grid">
                        <!-- 照片将通过 JavaScript 动态插入 -->
                    </div>
                </main>
            </div>
        </div>
    </section>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-img-wrapper">
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
        </div>
        <div class="lightbox-preview-strip" id="lightbox-preview-strip"></div>
        <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>

    <!-- 页脚 -->
    <footer></footer>

    <script src="common.js"></script>
    <script src="data.js?v=1"></script>
    <script src="script.js?v=1"></script>
</body>
</html>
