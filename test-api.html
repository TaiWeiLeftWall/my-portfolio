<!doctype html>
<html>
<head><meta charset="utf-8"><title>API Test</title></head>
<body>
<h1>API 连接测试</h1>
<div id="result"><b>测试中...</b></div>
<script>
var xhr = new XMLHttpRequest();
xhr.open('GET', '/api/state', true);
xhr.timeout = 5000;
xhr.onload = function() {
    var r = document.getElementById('result');
    if (xhr.status == 200) {
        try { var d = JSON.parse(xhr.responseText); r.innerHTML = '<b>成功</b><br>图片组: ' + d.photoGroups.length + '<br>视频: ' + d.videos.length + '<br>项目: ' + d.commercialProjects.length; } catch(e) { r.innerHTML = '<b>解析失败</b>: ' + e.message + '<pre>' + xhr.responseText.slice(0,500) + '</pre>'; }
    } else {
        r.innerHTML = '<b>HTTP错误</b>: ' + xhr.status + ' ' + xhr.statusText;
    }
};
xhr.onerror = function() { document.getElementById('result').innerHTML = '<b>网络错误</b> - 无法连接到服务器'; };
xhr.ontimeout = function() { document.getElementById('result').innerHTML = '<b>超时</b> - 5秒无响应'; };
xhr.send();
</script>
</body>
</html>
