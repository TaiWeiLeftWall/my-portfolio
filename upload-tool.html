<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片上传工具 - 摄影作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .upload-section {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #c9a962;
        }

        .upload-area.dragover {
            border-color: #c9a962;
            background: rgba(201, 169, 98, 0.1);
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .form-group {
            margin: 20px 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.7);
        }

        .helper-text {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-top: 10px;
        }

        .tag-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .tag-option:hover {
            border-color: #c9a962;
        }

        .tag-option.selected {
            background: #c9a962;
            color: #0a0a0a;
            border-color: #c9a962;
        }

        .tag-option input[type="checkbox"] {
            display: inline;
            width: auto;
            margin: 0;
        }

        select, input[type="text"], input[type="date"] {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.2);
            color: #f5f5f5;
            padding: 12px;
            font-size: 14px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            background: #c9a962;
            color: #0a0a0a;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 5px;
        }

        .btn:hover {
            background: #d4b872;
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #444;
            color: #fff;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .preview-item {
            background: #1a1a1a;
            padding: 8px;
            position: relative;
        }

        .preview-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .preview-item .filename {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 5px;
        }

        .preview-item .date-badge {
            font-size: 10px;
            color: #c9a962;
            background: rgba(201, 169, 98, 0.15);
            padding: 2px 6px;
            border-radius: 2px;
            margin-top: 3px;
            display: inline-block;
        }

        .preview-item .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            width: 20px;
            height: 20px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 12px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #81c784;
        }

        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: #e57373;
        }

        .status.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid rgba(33, 150, 243, 0.5);
            color: #64b5f6;
        }

        .not-support {
            background: rgba(255, 152, 0, 0.2);
            border: 1px solid rgba(255, 152, 0, 0.5);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }

        .group-info {
            background: rgba(201, 169, 98, 0.1);
            border: 1px solid rgba(201, 169, 98, 0.3);
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .group-info h4 {
            color: #c9a962;
            margin-bottom: 10px;
        }

        .group-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .group-tag {
            background: #c9a962;
            color: #0a0a0a;
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片上传工具</h1>

        <div id="not-support" class="not-support" style="display: none;">
            您的浏览器不支持 File System Access API<br>
            请使用 Chrome 或 Edge 浏览器以获得完整功能
        </div>

        <div class="upload-section">
            <div class="upload-area" id="drop-zone">
                <div class="upload-icon">+</div>
                <p>点击选择图片或拖拽到此处</p>
                <p class="helper-text">支持 JPG, PNG, WebP（可多选）· 自动读取EXIF日期</p>
                <input type="file" id="file-input" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label>图片分类（必选）</label>
                <div class="tag-options" id="tag-options">
                    <label class="tag-option">
                        <input type="checkbox" name="tags" value="landscape">
                        风光
                    </label>
                    <label class="tag-option">
                        <input type="checkbox" name="tags" value="portrait">
                        人像
                    </label>
                    <label class="tag-option">
                        <input type="checkbox" name="tags" value="street">
                        街头
                    </label>
                    <label class="tag-option">
                        <input type="checkbox" name="tags" value="travel">
                        旅行
                    </label>
                </div>
            </div>

            <div class="preview-grid" id="preview-grid"></div>

            <div id="group-info" class="group-info" style="display: none;">
                <h4>自动分组预览</h4>
                <div id="group-list" class="group-list"></div>
            </div>

            <div style="margin-top: 20px;">
                <button class="btn" id="save-btn" onclick="selectAndSave()" disabled>保存并同步到主页</button>
                <button class="btn btn-secondary" onclick="clearAll()">清空</button>
            </div>

            <div id="status"></div>
        </div>

        <p class="helper-text" style="margin-top: 20px; text-align: center;">
            使用说明：上传图片后会自动识别EXIF日期，同一天的照片自动编为一组<br>
            点击「保存并同步到主页」将图片保存并更新到网站
        </p>
    </div>

    <script>
        let selectedFiles = [];
        const isSupported = 'showDirectoryPicker' in window;

        if (!isSupported) {
            document.getElementById('not-support').style.display = 'block';
        }

        // EXIF 日期提取 - 简化实现
        function getExifDate(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const view = new DataView(e.target.result);

                    // 检查 JPEG 魔术字节
                    if (view.getUint16(0, false) !== 0xFFD8) {
                        resolve(null);
                        return;
                    }

                    const length = view.byteLength;
                    let offset = 2;

                    while (offset < length) {
                        if (view.getUint16(offset, false) === 0xFFE1) {
                            // APP1 (EXIF)
                            const exifData = String.fromCharCode(
                                ...new Uint8Array(e.target.result.slice(offset + 4, offset + 10))
                            );

                            if (exifData === 'Exif') {
                                // 查找 DateTimeOriginal (0x9003)
                                const result = findExifDate(e.target.result, offset + 10);
                                resolve(result);
                                return;
                            }
                        }
                        offset += 2 + view.getUint16(offset + 2, false);
                    }
                    resolve(null);
                };
                reader.readAsArrayBuffer(file.slice(0, 128 * 1024)); // 只读前128KB
            });
        }

        function findExifDate(buffer, tiffOffset) {
            const view = new DataView(buffer);
            const byteOrder = view.getUint16(tiffOffset, false);
            const littleEndian = byteOrder === 0x4949;

            const ifdOffset = view.getUint32(tiffOffset + 4, littleEndian);
            const ifdStart = tiffOffset + ifdOffset;

            const numEntries = view.getUint16(ifdStart, littleEndian);

            for (let i = 0; i < numEntries; i++) {
                const entryOffset = ifdStart + 2 + i * 12;
                const tag = view.getUint16(entryOffset, littleEndian);

                if (tag === 0x9003) { // DateTimeOriginal
                    const valueOffset = view.getUint32(entryOffset + 8, littleEndian);
                    const dateOffset = tiffOffset + valueOffset;

                    // 格式: "YYYY:MM:DD HH:MM:SS"
                    const year = view.getUint8(dateOffset, littleEndian) * 1000 + view.getUint8(dateOffset + 1, littleEndian);
                    const month = view.getUint8(dateOffset + 3, littleEndian) * 10 + view.getUint8(dateOffset + 4, littleEndian);
                    const day = view.getUint8(dateOffset + 6, littleEndian) * 10 + view.getUint8(dateOffset + 7, littleEndian);

                    if (year > 2000 && year < 2100 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                        return `${year}-${String(month).padStart(2, '0')}`;
                    }
                }
            }
            return null;
        }

        // 标签选择
        document.querySelectorAll('.tag-option').forEach(option => {
            option.addEventListener('click', (e) => {
                if (e.target.type === 'checkbox') return;
                const checkbox = option.querySelector('input[type="checkbox"]');
                checkbox.checked = !checkbox.checked;
                option.classList.toggle('selected', checkbox.checked);
                e.preventDefault();
            });
        });

        document.querySelectorAll('.tag-option input[type="checkbox"]').forEach(cb => {
            if (cb.checked) {
                cb.closest('.tag-option').classList.add('selected');
            }
        });

        // 文件输入
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        async function handleFiles(files) {
            const status = document.getElementById('status');
            status.className = 'status info';
            status.innerHTML = '正在读取图片EXIF日期...';

            let processed = 0;
            let hasExif = false;

            // 从文件名提取日期 (格式: yyyymmdd 或 yyyy-mm-dd)
            function extractDateFromFilename(filename) {
                const match = filename.match(/(\d{4})[-_]?(\d{2})[-_]?(\d{2})/);
                if (match) {
                    return `${match[1]}-${match[2]}-${match[3]}`;
                }
                return null;
            }

            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;

                const exifDate = await getExifDate(file);
                const filenameDate = extractDateFromFilename(file.name);
                const date = filenameDate || exifDate || new Date(file.lastModified).toISOString().slice(0, 7);

                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedFiles.push({
                        file: file,
                        preview: e.target.result,
                        name: file.name,
                        date: date
                    });

                    if (exifDate) hasExif = true;

                    processed++;
                    if (processed === files.length) {
                        renderPreview();
                        updateGroupPreview();
                        status.innerHTML = hasExif ? '已识别EXIF日期' : '部分图片无EXIF信息，使用文件日期';
                        setTimeout(() => { if (status.innerHTML.includes('EXIF')) status.innerHTML = ''; }, 2000);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPreview() {
            const grid = document.getElementById('preview-grid');
            grid.innerHTML = '';

            selectedFiles.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <img src="${item.preview}" alt="${item.name}">
                    <button class="remove-btn" onclick="removeFile(${index})">x</button>
                    <div class="filename">${item.name}</div>
                    ${item.date ? `<span class="date-badge">${item.date}</span>` : ''}
                `;
                grid.appendChild(div);
            });

            document.getElementById('save-btn').disabled = selectedFiles.length === 0 || !isSupported;
        }

        function updateGroupPreview() {
            const groupInfo = document.getElementById('group-info');
            const groupList = document.getElementById('group-list');

            // 按日期分组
            const groups = {};
            selectedFiles.forEach(item => {
                const date = item.date || '未知日期';
                if (!groups[date]) groups[date] = [];
                groups[date].push(item);
            });

            const dates = Object.keys(groups).sort().reverse();

            if (dates.length === 0) {
                groupInfo.style.display = 'none';
                return;
            }

            groupInfo.style.display = 'block';
            groupList.innerHTML = dates.map(date =>
                `<span class="group-tag">${date} (${groups[date].length}张)</span>`
            ).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreview();
            updateGroupPreview();
        }

        function clearAll() {
            selectedFiles = [];
            renderPreview();
            document.getElementById('group-info').style.display = 'none';
            document.getElementById('status').innerHTML = '';

            document.querySelectorAll('.tag-option input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
                cb.closest('.tag-option').classList.remove('selected');
            });
        }

        function getSelectedTags() {
            const tags = [];
            document.querySelectorAll('#tag-options input[type="checkbox"]:checked').forEach(cb => {
                tags.push(cb.value);
            });
            return tags;
        }

        async function selectAndSave() {
            const status = document.getElementById('status');

            if (selectedFiles.length === 0) {
                status.className = 'status error';
                status.innerHTML = '请先选择图片';
                return;
            }

            const tags = getSelectedTags();
            if (tags.length === 0) {
                status.className = 'status error';
                status.innerHTML = '请至少选择一个图片标签类型';
                return;
            }

            try {
                const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'desktop' });

                // 进入 images 子目录
                let imagesHandle;
                try {
                    imagesHandle = await dirHandle.getDirectoryHandle('images', { create: true });
                } catch {
                    imagesHandle = dirHandle;
                }

                status.className = 'status info';
                status.innerHTML = `正在保存 ${selectedFiles.length} 张图片...`;

                // 按日期分组
                const groups = {};
                selectedFiles.forEach(item => {
                    const date = item.date || '未知日期';
                    if (!groups[date]) groups[date] = [];
                    groups[date].push(item);
                });

                // 使用第一个选中的标签作为分类文件夹
                const category = tags[0];

                // 保存图片并记录路径
                const savedByGroup = {};
                for (const date in groups) {
                    savedByGroup[date] = [];
                    // 创建分类子目录
                    const categoryDirHandle = await imagesHandle.getDirectoryHandle(category, { create: true });
                    // 使用完整日期作为文件夹名 (yyyy-mm-dd)
                    const dateStr = date; // date 已经是 yyyy-mm-dd 格式
                    const dateDirHandle = await categoryDirHandle.getDirectoryHandle(dateStr, { create: true });

                    for (const item of groups[date]) {
                        let filename = item.name;
                        let fileHandle;

                        while (true) {
                            try {
                                fileHandle = await dateDirHandle.getFileHandle(filename, { create: true });
                                break;
                            } catch {
                                const nameParts = filename.match(/^(.+?)(\.[^.]+)?$/);
                                filename = `${nameParts[1]}_${Date.now()}${nameParts[2] || ''}`;
                            }
                        }

                        const writable = await fileHandle.createWritable();
                        await writable.write(item.file);
                        await writable.close();

                        savedByGroup[date].push({
                            filename,
                            path: `images/${category}/${dateStr}/${filename}`,
                            title: ''
                        });
                    }
                }

                // 更新 data.js
                await updateDataJs(dirHandle, savedByGroup, tags);

                status.className = 'status success';
                status.innerHTML = `
                    保存成功！<br>
                    已保存 ${selectedFiles.length} 张图片<br>
                    已按日期自动编为 ${Object.keys(groups).length} 个组<br>
                    已同步到 data.js<br>
                    <a href="index.html?t=${Date.now()}" style="color:#c9a962;">点击查看主页 &rarr;</a>
                `;

                selectedFiles = [];
                renderPreview();
                updateGroupPreview();
                clearAll();

            } catch (error) {
                if (error.name === 'AbortError') {
                    status.innerHTML = '已取消';
                    return;
                }
                status.className = 'status error';
                status.innerHTML = `保存失败: ${error.message}`;
            }
        }

        async function updateDataJs(dirHandle, savedByGroup, tags) {
            let dataJsHandle;
            let dataJsContent = '';

            try {
                dataJsHandle = await dirHandle.getFileHandle('data.js');
                const file = await dataJsHandle.getFile();
                dataJsContent = await file.text();
            } catch {
                return;
            }

            // 按日期排序（最新的在前面）
            const sortedDates = Object.keys(savedByGroup).sort().reverse();

            // 构建新的 photoGroups 条目
            const newGroups = sortedDates.map(date => {
                const images = savedByGroup[date].map(img => {
                    return `            {
                src: "${img.path}",
                title: "",
                description: ""
            }`;
                }).join(',\n');

                return `    {
        category: "${tags.join(',') || 'landscape'}",
        title: "",
        description: "",
        date: "${date}",
        cols: 3,
        images: [
${images}
        ]
    }`;
            }).join(',\n');

            // 检查是否有空的 photoGroups
            if (dataJsContent.includes('const photoGroups = []')) {
                dataJsContent = dataJsContent.replace(
                    'const photoGroups = []',
                    `const photoGroups = [\n${newGroups}\n]`
                );
            } else {
                // 在 photoGroups = [ 后面添加
                dataJsContent = dataJsContent.replace(
                    'const photoGroups = [',
                    `const photoGroups = [\n${newGroups},`
                );
            }

            const writable = await dataJsHandle.createWritable();
            await writable.write(dataJsContent);
            await writable.close();
        }
    </script>
</body>
</html>
