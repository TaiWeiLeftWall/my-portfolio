<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片上传工具 - 摄影作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .upload-section {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #c9a962;
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .form-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.7);
        }

        select, input[type="text"], input[type="date"] {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.2);
            color: #f5f5f5;
            padding: 12px;
            font-size: 14px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            background: #c9a962;
            color: #0a0a0a;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 5px;
        }

        .btn:hover {
            background: #d4b872;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
        }

        .btn-outline:hover {
            border-color: #c9a962;
            color: #c9a962;
            background: transparent;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .preview-item {
            background: #1a1a1a;
            padding: 10px;
            position: relative;
        }

        .preview-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .preview-item .info {
            padding: 10px 0;
            font-size: 12px;
        }

        .preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            border-radius: 50%;
        }

        .output-section {
            background: #141414;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
        }

        .output-section textarea {
            width: 100%;
            height: 300px;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.2);
            color: #f5f5f5;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }

        .helper-text {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-top: 10px;
            line-height: 1.6;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            cursor: pointer;
        }

        .tab-btn.active {
            background: #c9a962;
            color: #0a0a0a;
            border-color: #c9a962;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片上传工具</h1>

        <div class="upload-section">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="single">单独图片</button>
                <button class="tab-btn" data-tab="group">组照</button>
            </div>

            <!-- 单独图片模式 -->
            <div id="single-tab">
                <div class="upload-area" onclick="document.getElementById('single-input').click()">
                    <div class="upload-icon">+</div>
                    <p>点击选择图片或拖拽到此处</p>
                    <p class="helper-text">支持 JPG, PNG, WebP</p>
                </div>
                <input type="file" id="single-input" accept="image/*" multiple>

                <div class="form-group">
                    <label>分类</label>
                    <select id="single-category">
                        <option value="landscape">风光</option>
                        <option value="portrait">人像</option>
                        <option value="street">街头</option>
                        <option value="travel">旅行</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>方向</label>
                    <select id="single-orientation">
                        <option value="horizontal">横版 (3:2)</option>
                        <option value="vertical">竖版 (2:3)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>日期</label>
                    <input type="month" id="single-date" value="">
                </div>
            </div>

            <!-- 组照模式 -->
            <div id="group-tab" class="hidden">
                <div class="upload-area" onclick="document.getElementById('group-input').click()">
                    <div class="upload-icon">+</div>
                    <p>点击选择多张图片创建组照</p>
                    <p class="helper-text">支持 JPG, PNG, WebP，可多选</p>
                </div>
                <input type="file" id="group-input" accept="image/*" multiple>

                <div class="form-group">
                    <label>组照标题</label>
                    <input type="text" id="group-title" placeholder="例如：人像系列 - 自然光">
                </div>

                <div class="form-group">
                    <label>分类</label>
                    <select id="group-category">
                        <option value="landscape">风光</option>
                        <option value="portrait">人像</option>
                        <option value="street">街头</option>
                        <option value="travel">旅行</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>每行图片数量</label>
                    <select id="group-cols">
                        <option value="2">2列</option>
                        <option value="3" selected>3列</option>
                        <option value="4">4列</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>日期</label>
                    <input type="month" id="group-date" value="">
                </div>
            </div>

            <div class="preview-grid" id="preview-grid"></div>

            <div style="margin-top: 20px;">
                <button class="btn" onclick="generateCode()">生成代码</button>
                <button class="btn btn-outline" onclick="clearAll()">清空</button>
            </div>
        </div>

        <div class="output-section">
            <h3 style="margin-bottom: 15px;">生成的代码</h3>
            <textarea id="output" readonly placeholder="点击上方「生成代码」按钮查看结果"></textarea>
            <div style="margin-top: 15px;">
                <button class="btn" onclick="copyCode()">复制代码</button>
                <button class="btn btn-outline" onclick="copyToClipboard()">复制到 data.js 格式</button>
            </div>
            <p class="helper-text">
                使用说明：<br>
                1. 选择图片并填写信息<br>
                2. 点击「生成代码」<br>
                3. 复制生成的代码到 data.js 文件中<br>
                4. 如果是本地图片，请先将图片放入 my-website/images/ 文件夹，然后使用相对路径如 'images/photo1.jpg'
            </p>
        </div>
    </div>

    <script>
        let singleImages = [];
        let groupImages = [];
        let currentMode = 'single';

        // 标签切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.tab;

                document.getElementById('single-tab').classList.toggle('hidden', currentMode !== 'single');
                document.getElementById('group-tab').classList.toggle('hidden', currentMode !== 'group');
            });
        });

        // 单图上传
        document.getElementById('single-input').addEventListener('change', function(e) {
            handleSingleFiles(this.files);
        });

        function handleSingleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    singleImages.push({
                        name: file.name,
                        dataUrl: e.target.result,
                        category: document.getElementById('single-category').value,
                        orientation: document.getElementById('single-orientation').value,
                        date: document.getElementById('single-date').value
                    });
                    renderPreview();
                };
                reader.readAsDataURL(file);
            });
        }

        // 组图上传
        document.getElementById('group-input').addEventListener('change', function(e) {
            handleGroupFiles(this.files);
        });

        function handleGroupFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    groupImages.push({
                        name: file.name,
                        dataUrl: e.target.result
                    });
                    renderPreview();
                };
                reader.readAsDataURL(file);
            });
        }

        // 渲染预览
        function renderPreview() {
            const grid = document.getElementById('preview-grid');
            grid.innerHTML = '';

            const images = currentMode === 'single' ? singleImages : groupImages;

            images.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `
                    <img src="${img.dataUrl}" alt="${img.name}">
                    <button class="remove-btn" onclick="removeImage(${index})">x</button>
                    <div class="info">${img.name}</div>
                `;
                grid.appendChild(item);
            });
        }

        // 移除图片
        function removeImage(index) {
            if (currentMode === 'single') {
                singleImages.splice(index, 1);
            } else {
                groupImages.splice(index, 1);
            }
            renderPreview();
        }

        // 清空
        function clearAll() {
            singleImages = [];
            groupImages = [];
            document.getElementById('output').value = '';
            renderPreview();
        }

        // 生成代码
        function generateCode() {
            const output = document.getElementById('output');

            if (currentMode === 'single') {
                if (singleImages.length === 0) {
                    output.value = '请先上传图片';
                    return;
                }

                let code = '// 单独图片\n[\n';
                singleImages.forEach((img, i) => {
                    const title = img.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
                    code += `    {\n`;
                    code += `        category: "${img.category}",\n`;
                    code += `        orientation: "${img.orientation}",\n`;
                    code += `        title: "${title}",\n`;
                    code += `        description: "",\n`;
                    code += `        date: "${img.date || '2024-01'}",\n`;
                    code += `        src: "${img.name}" // 请替换为实际图片路径\n`;
                    code += `    }`;
                    code += i < singleImages.length - 1 ? ',\n' : '\n';
                });
                code += ']';
                output.value = code;
            } else {
                if (groupImages.length === 0) {
                    output.value = '请先上传图片';
                    return;
                }

                const title = document.getElementById('group-title').value || '新组照';
                const category = document.getElementById('group-category').value;
                const cols = document.getElementById('group-cols').value;
                const date = document.getElementById('group-date').value || '2024-01';

                let code = '// 组照\n{\n';
                code += `    category: "${category}",\n`;
                code += `    title: "${title}",\n`;
                code += `    description: "",\n`;
                code += `    date: "${date}",\n`;
                code += `    cols: ${cols},\n`;
                code += '    images: [\n';

                groupImages.forEach((img, i) => {
                    const imgTitle = img.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
                    code += `        {\n`;
                    code += `            src: "${img.name}", // 请替换为实际图片路径\n`;
                    code += `            title: "${imgTitle}",\n`;
                    code += `            description: ""\n`;
                    code += `        }`;
                    code += i < groupImages.length - 1 ? ',\n' : '\n';
                });

                code += '    ]\n';
                code += '}';
                output.value = code;
            }
        }

        // 复制代码
        function copyCode() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            alert('已复制到剪贴板');
        }

        // 复制到 data.js 格式
        function copyToClipboard() {
            generateCode();
            alert('请将生成的代码复制到 data.js 文件的 photos 数组或 photoGroups 数组中');
        }
    </script>
</body>
</html>
