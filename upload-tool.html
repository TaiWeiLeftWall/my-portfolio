<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片上传工具 - 摄影作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Text', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.47;
            letter-spacing: -0.374px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 40px;
            letter-spacing: 0;
            color: #1d1d1f;
        }

        .upload-section {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 32px;
            border-radius: 18px;
        }

        .upload-area {
            border: 2px dashed #e0e0e0;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
            border-radius: 11px;
            background: #ffffff;
        }

        .upload-area:hover {
            border-color: #0066cc;
        }

        .upload-area.dragover {
            border-color: #0066cc;
            background: rgba(0, 102, 204, 0.05);
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: #7a7a7a;
        }

        .form-group {
            margin: 24px 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333333;
            font-weight: 600;
            font-size: 14px;
        }

        .helper-text {
            color: #7a7a7a;
            font-size: 12px;
            margin-top: 12px;
        }

        .tag-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .tag-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            font-size: 12px;
            font-weight: 400;
            color: #7a7a7a;
            background: #ffffff;
        }

        .tag-option:hover {
            border-color: #0066cc;
            color: #0066cc;
        }

        .tag-option.selected {
            background: #0066cc;
            color: #ffffff;
            border-color: #0066cc;
        }

        .tag-option input[type="checkbox"] {
            display: inline;
            width: auto;
            margin: 0;
        }

        select, input[type="text"], input[type="date"] {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            color: #1d1d1f;
            padding: 12px 14px;
            font-size: 14px;
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            font-family: inherit;
        }

        .btn {
            background: #0066cc;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            letter-spacing: -0.12px;
            margin: 6px;
            border-radius: 9999px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #0071e3;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            background: #e0e0e0;
            color: #7a7a7a;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #ffffff;
            color: #1d1d1f;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            border-color: #0066cc;
            color: #0066cc;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
            margin-top: 24px;
        }

        .preview-item {
            background: #ffffff;
            padding: 8px;
            position: relative;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .preview-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 4px;
        }

        .preview-item .filename {
            font-size: 11px;
            color: #7a7a7a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 8px;
        }

        .preview-item .date-badge {
            font-size: 10px;
            color: #0066cc;
            background: rgba(0, 102, 204, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: inline-block;
            font-weight: 400;
        }

        .preview-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: none;
            width: 20px;
            height: 20px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
        }

        .status.success {
            background: rgba(0, 125, 72, 0.1);
            border: 1px solid rgba(0, 125, 72, 0.3);
            color: #007d48;
        }

        .status.error {
            background: rgba(211, 0, 5, 0.1);
            border: 1px solid rgba(211, 0, 5, 0.3);
            color: #d30005;
        }

        .status.info {
            background: rgba(0, 102, 204, 0.1);
            border: 1px solid rgba(0, 102, 204, 0.3);
            color: #0066cc;
        }

        .not-support {
            background: rgba(255, 160, 0, 0.1);
            border: 1px solid rgba(255, 160, 0, 0.3);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            color: #7a7a7a;
        }

        .group-info {
            background: rgba(0, 102, 204, 0.05);
            border: 1px solid rgba(0, 102, 204, 0.2);
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .group-info h4 {
            color: #0066cc;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 14px;
        }

        .group-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .group-tag {
            background: #0066cc;
            color: #ffffff;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片上传工具</h1>

        <div id="not-support" class="not-support" style="display: none;">
            您的浏览器不支持 File System Access API<br>
            请使用 Chrome 或 Edge 浏览器以获得完整功能
        </div>

        <div class="upload-section">
            <div class="upload-area" id="drop-zone">
                <div class="upload-icon">+</div>
                <p>点击选择图片或拖拽到此处</p>
                <p class="helper-text">支持 JPG, PNG, WebP（可多选）· 自动读取EXIF日期</p>
                <input type="file" id="file-input" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label>图片分类（必选）</label>
                <div class="tag-options" id="tag-options">
                    <label class="tag-option">
                        <input type="checkbox" name="tags" value="landscape">
                        风光
                    </label>
                    <label class="tag-option">
                        <input type="checkbox" name="tags" value="portrait">
                        人像
                    </label>
                    <label class="tag-option">
                        <input type="checkbox" name="tags" value="street">
                        街头
                    </label>
                </div>
            </div>

            <div class="preview-grid" id="preview-grid"></div>

            <div id="group-info" class="group-info" style="display: none;">
                <h4>自动分组预览</h4>
                <div id="group-list" class="group-list"></div>
            </div>

            <div style="margin-top: 20px;">
                <button class="btn" id="save-btn" onclick="handleSaveBtnClick()" disabled>保存并同步到主页</button>
                <button class="btn btn-secondary" onclick="clearAll()">清空</button>
            </div>

            <div id="status"></div>
        </div>

        <p class="helper-text" style="margin-top: 20px; text-align: center;">
            使用说明：上传图片后会自动识别EXIF日期，同一天的照片自动编为一组<br>
            点击「保存并同步到主页」将图片保存并更新到网站
        </p>
    </div>

    <script>
        let selectedFiles = [];
        const isSupported = 'showDirectoryPicker' in window;

        // ========== R2 上传配置 ==========
        const R2_UPLOAD_URL = 'https://r2-upload.linweigh58.workers.dev/upload';
        const R2_BASE_URL = 'https://pub-0f1fd51184d04cc28d2ffffbd03a30de.r2.dev';
        const MAX_DIMENSION = 2500;
        const TARGET_SIZE_KB = 1500;

        // Canvas 压缩图片
        async function compressImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let { width, height } = img;

                    // 调整尺寸
                    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                        const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
                        width = Math.floor(width * ratio);
                        height = Math.floor(height * ratio);
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 逐步降低质量直到合适
                    let quality = 0.9;
                    let blob;

                    const tryCompress = () => {
                        canvas.toBlob((b) => {
                            if (b && b.size <= TARGET_SIZE_KB * 1024) {
                                blob = b;
                                resolve(blob);
                            } else if (quality > 0.3) {
                                quality -= 0.1;
                                tryCompress();
                            } else {
                                // 最后尝试，直接返回当前结果
                                resolve(blob || b);
                            }
                        }, 'image/jpeg', quality);
                    };

                    tryCompress();
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // 上传到 R2
        async function uploadToR2(blob, filename, category, dateStr) {
            if (!R2_UPLOAD_URL) {
                throw new Error('请先配置 R2_UPLOAD_URL');
            }

            const formData = new FormData();
            formData.append('image', blob, filename);
            formData.append('category', category);
            formData.append('date', dateStr);

            const response = await fetch(R2_UPLOAD_URL, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`上传失败: ${response.statusText}`);
            }

            return await response.json();
        }

        if (!isSupported) {
            document.getElementById('not-support').style.display = 'block';
        }

        // EXIF 日期提取 - 简化实现
        function getExifDate(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const view = new DataView(e.target.result);

                    // 检查 JPEG 魔术字节
                    if (view.getUint16(0, false) !== 0xFFD8) {
                        resolve(null);
                        return;
                    }

                    const length = view.byteLength;
                    let offset = 2;

                    while (offset < length) {
                        if (view.getUint16(offset, false) === 0xFFE1) {
                            // APP1 (EXIF)
                            const exifData = String.fromCharCode(
                                ...new Uint8Array(e.target.result.slice(offset + 4, offset + 10))
                            );

                            if (exifData === 'Exif') {
                                // 查找 DateTimeOriginal (0x9003)
                                const result = findExifDate(e.target.result, offset + 10);
                                resolve(result);
                                return;
                            }
                        }
                        offset += 2 + view.getUint16(offset + 2, false);
                    }
                    resolve(null);
                };
                reader.readAsArrayBuffer(file.slice(0, 128 * 1024)); // 只读前128KB
            });
        }

        function findExifDate(buffer, tiffOffset) {
            const view = new DataView(buffer);
            const byteOrder = view.getUint16(tiffOffset, false);
            const littleEndian = byteOrder === 0x4949;

            const ifdOffset = view.getUint32(tiffOffset + 4, littleEndian);
            const ifdStart = tiffOffset + ifdOffset;

            const numEntries = view.getUint16(ifdStart, littleEndian);

            for (let i = 0; i < numEntries; i++) {
                const entryOffset = ifdStart + 2 + i * 12;
                const tag = view.getUint16(entryOffset, littleEndian);

                if (tag === 0x9003) { // DateTimeOriginal
                    const valueOffset = view.getUint32(entryOffset + 8, littleEndian);
                    const dateOffset = tiffOffset + valueOffset;

                    // 格式: "YYYY:MM:DD HH:MM:SS"
                    const year = view.getUint8(dateOffset, littleEndian) * 1000 + view.getUint8(dateOffset + 1, littleEndian);
                    const month = view.getUint8(dateOffset + 3, littleEndian) * 10 + view.getUint8(dateOffset + 4, littleEndian);
                    const day = view.getUint8(dateOffset + 6, littleEndian) * 10 + view.getUint8(dateOffset + 7, littleEndian);

                    if (year > 2000 && year < 2100 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                        return `${year}-${String(month).padStart(2, '0')}`;
                    }
                }
            }
            return null;
        }

        // 标签选择
        document.querySelectorAll('.tag-option').forEach(option => {
            option.addEventListener('click', (e) => {
                if (e.target.type === 'checkbox') return;
                const checkbox = option.querySelector('input[type="checkbox"]');
                checkbox.checked = !checkbox.checked;
                option.classList.toggle('selected', checkbox.checked);
                e.preventDefault();
            });
        });

        document.querySelectorAll('.tag-option input[type="checkbox"]').forEach(cb => {
            if (cb.checked) {
                cb.closest('.tag-option').classList.add('selected');
            }
        });

        // 文件输入
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        async function handleFiles(files) {
            const status = document.getElementById('status');
            status.className = 'status info';
            status.innerHTML = '正在读取图片EXIF日期...';

            let processed = 0;
            let hasExif = false;

            // 从文件名提取日期 (格式: yyyymmdd 或 yyyy-mm-dd)
            function extractDateFromFilename(filename) {
                const match = filename.match(/(\d{4})[-_]?(\d{2})[-_]?(\d{2})/);
                if (match) {
                    return `${match[1]}-${match[2]}-${match[3]}`;
                }
                return null;
            }

            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;

                const exifDate = await getExifDate(file);
                const filenameDate = extractDateFromFilename(file.name);
                const date = filenameDate || exifDate || new Date(file.lastModified).toISOString().slice(0, 7);

                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedFiles.push({
                        file: file,
                        preview: e.target.result,
                        name: file.name,
                        date: date
                    });

                    if (exifDate) hasExif = true;

                    processed++;
                    if (processed === files.length) {
                        renderPreview();
                        updateGroupPreview();
                        status.innerHTML = hasExif ? '已识别EXIF日期' : '部分图片无EXIF信息，使用文件日期';
                        setTimeout(() => { if (status.innerHTML.includes('EXIF')) status.innerHTML = ''; }, 2000);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPreview() {
            const grid = document.getElementById('preview-grid');
            grid.innerHTML = '';

            selectedFiles.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <img src="${item.preview}" alt="${item.name}">
                    <button class="remove-btn" onclick="removeFile(${index})">x</button>
                    <div class="filename">${item.name}</div>
                    ${item.date ? `<span class="date-badge">${item.date}</span>` : ''}
                `;
                grid.appendChild(div);
            });

            document.getElementById('save-btn').disabled = selectedFiles.length === 0 || !isSupported;
        }

        function updateGroupPreview() {
            const groupInfo = document.getElementById('group-info');
            const groupList = document.getElementById('group-list');

            // 按日期分组
            const groups = {};
            selectedFiles.forEach(item => {
                const date = item.date || '未知日期';
                if (!groups[date]) groups[date] = [];
                groups[date].push(item);
            });

            const dates = Object.keys(groups).sort().reverse();

            if (dates.length === 0) {
                groupInfo.style.display = 'none';
                return;
            }

            groupInfo.style.display = 'block';
            groupList.innerHTML = dates.map(date =>
                `<span class="group-tag">${date} (${groups[date].length}张)</span>`
            ).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreview();
            updateGroupPreview();
        }

        function clearAll() {
            selectedFiles = [];
            renderPreview();
            document.getElementById('group-info').style.display = 'none';
            document.getElementById('status').innerHTML = '';

            document.querySelectorAll('.tag-option input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
                cb.closest('.tag-option').classList.remove('selected');
            });
        }

        function getSelectedTags() {
            const tags = [];
            document.querySelectorAll('#tag-options input[type="checkbox"]:checked').forEach(cb => {
                tags.push(cb.value);
            });
            return tags;
        }

        // 必须在用户直接点击事件中调用 showDirectoryPicker
        async function handleSaveBtnClick() {
            const status = document.getElementById('status');

            if (selectedFiles.length === 0) {
                status.className = 'status error';
                status.innerHTML = '请先选择图片';
                return;
            }

            const tags = getSelectedTags();
            if (tags.length === 0) {
                status.className = 'status error';
                status.innerHTML = '请至少选择一个图片标签类型';
                return;
            }

            if (!R2_UPLOAD_URL) {
                status.className = 'status error';
                status.innerHTML = '请先配置 R2_UPLOAD_URL（联系管理员部署 Worker）';
                return;
            }

            // 先选择目录（必须在用户直接点击中调用）
            let dirHandle;
            try {
                dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            } catch (err) {
                if (err.name === 'AbortError') {
                    status.innerHTML = '已取消';
                    return;
                }
                throw err;
            }

            // 目录选择成功后再执行上传
            await doSaveAndUpload(dirHandle, tags);
        }

        async function doSaveAndUpload(dirHandle, tags) {
            const status = document.getElementById('status');

            try {
                status.className = 'status info';
                status.innerHTML = `正在压缩并上传 ${selectedFiles.length} 张图片到 R2...`;

                const category = tags[0];
                const savedByGroup = {};
                let uploaded = 0;

                for (const item of selectedFiles) {
                    const date = item.date || new Date().toISOString().slice(0, 10);
                    const dateStr = date.length > 7 ? date : `${date}-01`;

                    // 压缩
                    status.innerHTML = `压缩中 ${uploaded + 1}/${selectedFiles.length}...`;
                    const compressedBlob = await compressImage(item.file);

                    // 生成文件名
                    const ext = item.name.split('.').pop() || 'jpg';
                    const filename = `${dateStr.replace(/-/g, '')}-${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

                    // 上传
                    status.innerHTML = `上传中 ${uploaded + 1}/${selectedFiles.length}...`;
                    const result = await uploadToR2(compressedBlob, filename, category, dateStr);

                    // 记录
                    if (!savedByGroup[date]) savedByGroup[date] = [];
                    savedByGroup[date].push({
                        filename,
                        path: result.url,
                        title: ''
                    });

                    uploaded++;
                }

                // 更新本地 data.js
                status.innerHTML = '更新 data.js...';
                await updateDataJsWithHandle(dirHandle, savedByGroup, tags);

                status.className = 'status success';
                status.innerHTML = `
                    上传成功！<br>
                    已上传 ${selectedFiles.length} 张图片到 R2<br>
                    已按日期自动编为 ${Object.keys(savedByGroup).length} 个组<br>
                    data.js 已更新，请提交到 GitHub<br>
                    <a href="index.html?t=${Date.now()}" style="color:#c9a962;">点击查看主页 &rarr;</a>
                `;

                selectedFiles = [];
                renderPreview();
                updateGroupPreview();
                clearAll();

            } catch (error) {
                if (error.name === 'AbortError') {
                    status.innerHTML = '已取消';
                    return;
                }
                status.className = 'status error';
                status.innerHTML = `上传失败: ${error.message}`;
                console.error(error);
            }
        }

        // 更新本地 data.js（接收已选择的目录句柄）
        async function updateDataJsWithHandle(dirHandle, savedByGroup, tags) {
            try {
                let dataJsHandle;
                let dataJsContent = '';

                try {
                    dataJsHandle = await dirHandle.getFileHandle('data.js');
                    const file = await dataJsHandle.getFile();
                    dataJsContent = await file.text();
                } catch {
                    alert('无法读取 data.js，请确保在项目根目录运行');
                    return;
                }

                // 按日期排序
                const sortedDates = Object.keys(savedByGroup).sort().reverse();

                // 构建新的 photoGroups 条目
                const newGroups = sortedDates.map(date => {
                    const images = savedByGroup[date].map(img => {
                        return `            {
                src: "${img.path}",
                title: "",
                description: ""
            }`;
                    }).join(',\n');

                    return `    {
        category: "${tags.join(',') || 'landscape'}",
        title: "",
        description: "",
        date: "${date}",
        cols: 3,
        images: [
${images}
        ]
    }`;
                }).join(',\n');

                // 检查是否有空的 photoGroups
                if (dataJsContent.includes('const photoGroups = []')) {
                    dataJsContent = dataJsContent.replace(
                        'const photoGroups = []',
                        `const photoGroups = [\n${newGroups}\n]`
                    );
                } else {
                    dataJsContent = dataJsContent.replace(
                        'const photoGroups = [',
                        `const photoGroups = [\n${newGroups},`
                    );
                }

                const writable = await dataJsHandle.createWritable();
                await writable.write(dataJsContent);
                await writable.close();

            } catch (error) {
                console.error('更新 data.js 失败:', error);
                throw error;
            }
        }
    </script>
</body>
</html>
